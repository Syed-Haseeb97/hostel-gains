<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hostel Gains - 3D Biomechanical Viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div class="viewer-card">
    <div class="header">
      <div>
        <div class="subtitle">3D Form Guide</div>
        <div id="title" class="title">Back Squat</div>
      </div>
    </div>

    <div id="viewport" class="viewport">
      <div class="world-container">
        <div id="world" class="world"></div>
      </div>
      <div class="drag-hint">Drag to rotate</div>
    </div>

    <div class="controls">
      <div class="btn-row">
        <button id="btnPlay" class="btn active">Pause</button>
        <button class="btn" data-speed="0.5">0.5x</button>
        <button class="btn active" data-speed="1">1.0x</button>
        <button class="btn" data-speed="1.5">1.5x</button>
        <button id="btnOrbit" class="btn active">Orbit</button>
        <button class="btn" data-view="90">Front</button>
        <button class="btn" data-view="0">Side</button>
        <button class="btn" data-view="-35">3/4</button>
      </div>

      <div class="info-box">
        <div><span class="info-label">Targets: </span><span id="targets">Quads, glutes, core</span></div>
        <div><span class="info-label">Form Cue: </span><span id="cue">Brace, sit between the hips, drive up.</span></div>
      </div>
    </div>
  </div>

  <script src="moves.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
